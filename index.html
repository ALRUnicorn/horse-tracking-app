<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horse Tracking - Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'DM Sans', sans-serif; }
        h1, h2, h3, .stat-value { font-family: 'Outfit', sans-serif; }
        .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); }
        .sold-badge { background: linear-gradient(135deg, #059669, #10b981); }
        .pending-badge { background: linear-gradient(135deg, #d97706, #f59e0b); }
        .active-badge { background: linear-gradient(135deg, #4f46e5, #6366f1); }
        .metric-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .metric-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 3px; }
        .fo-section { border-left: 3px solid; padding-left: 1rem; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ═══ ICONS ═══
        const Plus = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const Trash2 = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
        const Edit = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
        const TrendingUp = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
        const PieChart = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>;
        const BarChart3 = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>;
        const Calculator = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="4" y="2" width="16" height="20" rx="2"/></svg>;
        const Clock = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const Zap = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
        const CheckCircle = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const Target = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
        const Briefcase = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;
        const Shield = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
        const Activity = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;

        function App() {
            const [horses, setHorses] = useState([]);
            const [horseName, setHorseName] = useState('');
            const [purchaseDate, setPurchaseDate] = useState(new Date().toISOString().split('T')[0]);
            const [expenseName, setExpenseName] = useState('');
            const [expenseAmount, setExpenseAmount] = useState('');
            const [expenseDate, setExpenseDate] = useState(new Date().toISOString().split('T')[0]);
            const [commission, setCommission] = useState(10);
            const [customPrice, setCustomPrice] = useState('');
            const [activeView, setActiveView] = useState('horses');
            const [showAnalytics, setShowAnalytics] = useState(false);
            const [editingHorse, setEditingHorse] = useState(null);
            const [editingField, setEditingField] = useState(null);
            const [selectedHorseId, setSelectedHorseId] = useState(null);
            const [foEstimatedValues, setFoEstimatedValues] = useState({});

            const selectedHorse = useMemo(() => {
                if (!selectedHorseId) return null;
                return horses.find(h => h.id === selectedHorseId) || null;
            }, [horses, selectedHorseId]);

            useEffect(() => { setHorses(JSON.parse(localStorage.getItem('horses') || '[]')); }, []);
            useEffect(() => { localStorage.setItem('horses', JSON.stringify(horses)); }, [horses]);

            // ═══ HORSE CRUD ═══
            const addHorse = () => {
                if (!horseName.trim()) return;
                setHorses([...horses, { id: Date.now(), name: horseName, purchaseDate, expectedSaleDate: '', actualSaleDate: '', actualSalePrice: '', status: 'active', expenses: [] }]);
                setHorseName(''); setPurchaseDate(new Date().toISOString().split('T')[0]);
            };
            const updateHorseField = (horseId, field, value) => {
                setHorses(horses.map(h => {
                    if (h.id !== horseId) return h;
                    const updated = { ...h, [field]: value };
                    if (field === 'actualSaleDate') updated.status = value ? 'sold' : 'active';
                    return updated;
                }));
                setEditingField(null);
            };
            const deleteHorse = (id) => { setHorses(horses.filter(h => h.id !== id)); if (selectedHorseId === id) setSelectedHorseId(null); };
            const addExpense = () => {
                if (!expenseName.trim() || !expenseAmount || !selectedHorse) return;
                setHorses(horses.map(h => h.id === selectedHorse.id ? { ...h, expenses: [...h.expenses, { id: Date.now(), name: expenseName, amount: parseFloat(expenseAmount), date: expenseDate }] } : h));
                setExpenseName(''); setExpenseAmount(''); setExpenseDate(new Date().toISOString().split('T')[0]);
            };
            const deleteExpense = (expenseId) => {
                setHorses(horses.map(h => h.id === selectedHorse.id ? { ...h, expenses: h.expenses.filter(e => e.id !== expenseId) } : h));
            };

            // ═══ CALCULATIONS ═══
            const getTotalExpenses = (horse) => horse.expenses.reduce((s, e) => s + e.amount, 0);
            const getBreakEvenPrice = (totalExpenses) => totalExpenses / (1 - commission / 100);
            const calculateROI = (salePrice, totalExpenses) => salePrice * (1 - commission / 100) - totalExpenses;
            const calculateROIPercentage = (salePrice, totalExpenses) => totalExpenses === 0 ? 0 : (calculateROI(salePrice, totalExpenses) / totalExpenses) * 100;
            const calculateMOIC = (salePrice, totalExpenses) => totalExpenses === 0 ? 0 : (salePrice * (1 - commission / 100)) / totalExpenses;

            const getHoldingPeriodDays = (horse) => {
                if (!horse.purchaseDate) return 0;
                const end = horse.actualSaleDate ? new Date(horse.actualSaleDate) : new Date();
                return Math.max(0, Math.ceil((end - new Date(horse.purchaseDate)) / 86400000));
            };
            const getHoldingPeriodText = (horse) => {
                const d = getHoldingPeriodDays(horse);
                if (d === 0) return 'N/A';
                const y = Math.floor(d / 365), m = Math.floor((d % 365) / 30), r = d % 30;
                if (y > 0) return `${y}a ${m}m`;
                if (m > 0) return `${m}m ${r}j`;
                return `${d}j`;
            };
            const getExpectedHoldingText = (horse) => {
                if (!horse.purchaseDate || !horse.expectedSaleDate) return null;
                const d = Math.max(0, Math.ceil((new Date(horse.expectedSaleDate) - new Date(horse.purchaseDate)) / 86400000));
                const y = Math.floor(d / 365), m = Math.floor((d % 365) / 30);
                if (y > 0) return `${y}a ${m}m`; if (m > 0) return `${m}m ${d % 30}j`; return `${d}j`;
            };
            const getDaysUntilExpectedSale = (horse) => {
                if (!horse.expectedSaleDate || horse.actualSaleDate) return null;
                return Math.ceil((new Date(horse.expectedSaleDate) - new Date()) / 86400000);
            };
            const calculateIRR = (horse, salePrice) => {
                if (!horse.purchaseDate) return null;
                const yrs = getHoldingPeriodDays(horse) / 365.25;
                if (yrs <= 0) return 0;
                const total = getTotalExpenses(horse);
                if (total === 0) return 0;
                const roi = (salePrice * (1 - commission / 100)) / total;
                if (roi <= 0) return -100;
                return (Math.pow(roi, 1 / yrs) - 1) * 100;
            };

            const getCapitalTurnover = () => {
                const sold = horses.filter(h => h.actualSaleDate && h.actualSalePrice);
                if (sold.length === 0) return 0;
                const proceeds = sold.reduce((s, h) => s + (parseFloat(h.actualSalePrice) || 0) * (1 - commission / 100), 0);
                const deployed = horses.reduce((s, h) => s + getTotalExpenses(h), 0);
                return deployed === 0 ? 0 : proceeds / deployed;
            };
            const getVelocityOfDeals = () => {
                const sold = horses.filter(h => h.actualSaleDate && h.purchaseDate);
                if (sold.length === 0) return null;
                const totalDays = sold.reduce((s, h) => s + getHoldingPeriodDays(h), 0);
                const avg = totalDays / sold.length;
                return { avgDays: avg, avgMonths: avg / 30.44, dealsPerYear: 365.25 / (avg || 1), count: sold.length };
            };

            // ═══ FAMILY OFFICE METRICS ═══
            const getFOMetrics = () => {
                const totalPaidIn = horses.reduce((s, h) => s + getTotalExpenses(h), 0);
                const soldHorses = horses.filter(h => h.actualSaleDate && h.actualSalePrice);
                const activeHorses = horses.filter(h => !h.actualSaleDate);

                // DPI - Distributed to Paid-In (realized only)
                const totalDistributed = soldHorses.reduce((s, h) => s + (parseFloat(h.actualSalePrice) || 0) * (1 - commission / 100), 0);
                const dpi = totalPaidIn > 0 ? totalDistributed / totalPaidIn : 0;

                // RVPI - Residual Value to Paid-In (unrealized - estimated)
                const totalResidualValue = activeHorses.reduce((s, h) => {
                    const est = parseFloat(foEstimatedValues[h.id]) || 0;
                    return s + est * (1 - commission / 100);
                }, 0);
                const rvpi = totalPaidIn > 0 ? totalResidualValue / totalPaidIn : 0;

                // TVPI = DPI + RVPI
                const tvpi = dpi + rvpi;

                // Win rate
                const wins = soldHorses.filter(h => {
                    const pl = calculateROI(parseFloat(h.actualSalePrice) || 0, getTotalExpenses(h));
                    return pl >= 0;
                });
                const winRate = soldHorses.length > 0 ? (wins.length / soldHorses.length) * 100 : 0;

                // P&L dispersion
                const pls = soldHorses.map(h => calculateROI(parseFloat(h.actualSalePrice) || 0, getTotalExpenses(h)));
                const sortedPLs = [...pls].sort((a, b) => a - b);
                const bestDeal = pls.length > 0 ? Math.max(...pls) : 0;
                const worstDeal = pls.length > 0 ? Math.min(...pls) : 0;
                const medianDeal = pls.length > 0 ? sortedPLs[Math.floor(sortedPLs.length / 2)] : 0;
                const avgGain = wins.length > 0 ? wins.reduce((s, h) => s + calculateROI(parseFloat(h.actualSalePrice) || 0, getTotalExpenses(h)), 0) / wins.length : 0;
                const losses = soldHorses.filter(h => calculateROI(parseFloat(h.actualSalePrice) || 0, getTotalExpenses(h)) < 0);
                const avgLoss = losses.length > 0 ? losses.reduce((s, h) => s + Math.abs(calculateROI(parseFloat(h.actualSalePrice) || 0, getTotalExpenses(h))), 0) / losses.length : 0;
                const gainLossRatio = avgLoss > 0 ? avgGain / avgLoss : avgGain > 0 ? Infinity : 0;

                // Net margin
                const totalGrossRevenue = soldHorses.reduce((s, h) => s + (parseFloat(h.actualSalePrice) || 0), 0);
                const totalCommissions = soldHorses.reduce((s, h) => s + (parseFloat(h.actualSalePrice) || 0) * commission / 100, 0);
                const soldExpenses = soldHorses.reduce((s, h) => s + getTotalExpenses(h), 0);
                const netMargin = totalGrossRevenue > 0 ? ((totalDistributed - soldExpenses) / totalGrossRevenue) * 100 : 0;

                // Avg monthly cost per horse
                const avgMonthlyCost = horses.length > 0 ? horses.reduce((s, h) => {
                    const months = Math.max(1, getHoldingPeriodDays(h) / 30.44);
                    return s + getTotalExpenses(h) / months;
                }, 0) / horses.length : 0;

                // IRR by deal generation (sorted by purchase date)
                const soldSorted = [...soldHorses].sort((a, b) => new Date(a.purchaseDate) - new Date(b.purchaseDate));
                const irrByDeal = soldSorted.map((h, i) => ({
                    name: h.name,
                    irr: calculateIRR(h, parseFloat(h.actualSalePrice) || 0) || 0,
                    index: i + 1
                }));

                // Avg time to break-even (for sold horses that made profit)
                const avgBreakEvenMonths = wins.length > 0 ? wins.reduce((s, h) => s + getHoldingPeriodDays(h) / 30.44, 0) / wins.length : 0;

                // J-Curve data: cumulative cash flow over time
                const allEvents = [];
                horses.forEach(h => {
                    h.expenses.forEach(e => {
                        allEvents.push({ date: e.date || h.purchaseDate, amount: -e.amount });
                    });
                    if (h.actualSaleDate && h.actualSalePrice) {
                        allEvents.push({ date: h.actualSaleDate, amount: (parseFloat(h.actualSalePrice) || 0) * (1 - commission / 100) });
                    }
                });
                allEvents.sort((a, b) => new Date(a.date) - new Date(b.date));
                let cumulative = 0;
                const jCurveData = allEvents.map(e => { cumulative += e.amount; return { date: e.date, cumulative }; });

                // Pipeline: upcoming expected sales
                const pipeline = activeHorses
                    .filter(h => h.expectedSaleDate)
                    .sort((a, b) => new Date(a.expectedSaleDate) - new Date(b.expectedSaleDate))
                    .map(h => ({
                        ...h,
                        daysLeft: getDaysUntilExpectedSale(h),
                        estimatedValue: parseFloat(foEstimatedValues[h.id]) || 0,
                        totalInvested: getTotalExpenses(h)
                    }));

                return {
                    totalPaidIn, totalDistributed, totalResidualValue,
                    dpi, rvpi, tvpi,
                    winRate, wins: wins.length, losses: losses.length,
                    bestDeal, worstDeal, medianDeal, avgGain, avgLoss, gainLossRatio,
                    netMargin, totalCommissions, avgMonthlyCost,
                    irrByDeal, avgBreakEvenMonths,
                    jCurveData, pipeline,
                    soldCount: soldHorses.length, activeCount: activeHorses.length
                };
            };

            // ═══ ANALYTICS HELPERS ═══
            const getCategoryBreakdown = (horse) => {
                const cat = {}; horse.expenses.forEach(e => { cat[e.name] = (cat[e.name] || 0) + e.amount; });
                return Object.entries(cat).map(([name, amount]) => ({ name, amount })).sort((a, b) => b.amount - a.amount);
            };
            const getMonthlyExpenses = (horse) => {
                const m = {}; horse.expenses.forEach(e => { const d = new Date(e.date || Date.now()); const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; m[k] = (m[k]||0) + e.amount; });
                return Object.entries(m).sort(([a],[b]) => a.localeCompare(b)).map(([month, amount]) => ({month, amount}));
            };
            const getMonthlyAverage = (horse) => { const m = getMonthlyExpenses(horse); return m.length === 0 ? 0 : m.reduce((s,x)=>s+x.amount,0)/m.length; };
            const formatMonthLabel = (mk) => { const [y,m] = mk.split('-'); return new Date(y,parseInt(m)-1).toLocaleDateString('fr-FR',{month:'short',year:'2-digit'}); };
            const getColorForIndex = (i) => ['#4338ca','#0891b2','#059669','#d97706','#dc2626','#7c3aed','#db2777','#0d9488','#ea580c','#4f46e5'][i%10];

            const getGlobalStats = () => {
                const totalInvested = horses.reduce((s, h) => s + getTotalExpenses(h), 0);
                const sold = horses.filter(h => h.status === 'sold' && h.actualSalePrice);
                const totalRevenue = sold.reduce((s, h) => s + (parseFloat(h.actualSalePrice)||0) * (1 - commission/100), 0);
                const totalPL = totalRevenue - sold.reduce((s, h) => s + getTotalExpenses(h), 0);
                return { totalInvested, horseCount: horses.length, activeCount: horses.filter(h => h.status !== 'sold').length, soldCount: sold.length, totalRevenue, totalPL };
            };

            const scenariosPrices = [10000, 12500, 15000, 17500, 20000, 25000];

            // ═══ FORMAT HELPERS ═══
            const formatDateFR = (dateStr) => {
                if (!dateStr) return '—';
                const d = new Date(dateStr);
                return `${d.getDate()} ${['jan.','fév.','mars','avr.','mai','juin','juil.','août','sep.','oct.','nov.','déc.'][d.getMonth()]} ${d.getFullYear()}`;
            };
            const fmt = (n) => n.toLocaleString('fr-FR', { maximumFractionDigits: 0 });
            const fmtPct = (n) => `${n >= 0 ? '+' : ''}${n.toFixed(1)}%`;

            // ═══ COMPONENTS ═══
            const EditableDate = ({ horse, field, label }) => {
                const isEditing = editingField?.horseId === horse.id && editingField?.field === field;
                const value = horse[field];
                if (isEditing) {
                    const parts = value ? value.split('-') : ['2025','01','01'];
                    return (
                        <span className="inline-flex items-center gap-1 flex-wrap" onClick={e => e.stopPropagation()}>
                            <span className="text-xs text-slate-500 mr-1">{label}:</span>
                            <select defaultValue={parts[2]} onChange={e => updateHorseField(horse.id, field, `${parts[0]}-${parts[1]}-${e.target.value}`)} className="text-xs px-1 py-0.5 border border-indigo-300 rounded bg-white outline-none">
                                {Array.from({length:31},(_,i)=>i+1).map(d => <option key={d} value={String(d).padStart(2,'0')}>{d}</option>)}
                            </select>
                            <select defaultValue={parts[1]} onChange={e => updateHorseField(horse.id, field, `${parts[0]}-${e.target.value}-${parts[2]}`)} className="text-xs px-1 py-0.5 border border-indigo-300 rounded bg-white outline-none">
                                {['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'].map((m,i) => <option key={i} value={String(i+1).padStart(2,'0')}>{m}</option>)}
                            </select>
                            <select defaultValue={parts[0]} onChange={e => updateHorseField(horse.id, field, `${e.target.value}-${parts[1]}-${parts[2]}`)} className="text-xs px-1 py-0.5 border border-indigo-300 rounded bg-white outline-none">
                                {Array.from({length:20},(_,i)=>2015+i).map(y => <option key={y} value={y}>{y}</option>)}
                            </select>
                            <button onClick={e => { e.stopPropagation(); setEditingField(null); }} className="text-indigo-500 hover:text-indigo-700 text-xs ml-1">✓</button>
                        </span>
                    );
                }
                return (
                    <span className="inline-flex items-center gap-1 cursor-pointer group" onClick={e => { e.stopPropagation(); setEditingField({ horseId: horse.id, field }); }}>
                        <span className="text-xs text-slate-500">{label}: {formatDateFR(value)}</span>
                        <span className="text-slate-300 group-hover:text-indigo-500 transition"><Edit size={10} /></span>
                    </span>
                );
            };
            const EditablePrice = ({ horse }) => {
                const isEditing = editingField?.horseId === horse.id && editingField?.field === 'actualSalePrice';
                if (isEditing) return (
                    <input type="number" defaultValue={horse.actualSalePrice} autoFocus placeholder="Prix" onClick={e => e.stopPropagation()}
                        onBlur={e => updateHorseField(horse.id, 'actualSalePrice', e.target.value)}
                        onKeyDown={e => { if (e.key === 'Enter') updateHorseField(horse.id, 'actualSalePrice', e.target.value); }}
                        className="text-xs px-2 py-1 border border-indigo-300 rounded bg-white w-24 focus:ring-2 focus:ring-indigo-400 outline-none" />
                );
                return (
                    <span className="inline-flex items-center gap-1 cursor-pointer group" onClick={e => { e.stopPropagation(); setEditingField({ horseId: horse.id, field: 'actualSalePrice' }); }}>
                        <span className="text-xs text-slate-500">Vente: {horse.actualSalePrice ? `${fmt(parseFloat(horse.actualSalePrice))} €` : '—'}</span>
                        <span className="text-slate-300 group-hover:text-indigo-500 transition"><Edit size={10} /></span>
                    </span>
                );
            };
            const StatusBadge = ({ horse }) => {
                if (horse.actualSaleDate) return <span className="sold-badge text-white text-xs px-2 py-0.5 rounded-full font-medium">Vendu</span>;
                const d = getDaysUntilExpectedSale(horse);
                if (d !== null && d <= 30 && d >= 0) return <span className="pending-badge text-white text-xs px-2 py-0.5 rounded-full font-medium">Bientôt</span>;
                if (d !== null && d < 0) return <span className="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-medium">En retard</span>;
                return <span className="active-badge text-white text-xs px-2 py-0.5 rounded-full font-medium">Actif</span>;
            };

            // ═══ GAUGE COMPONENT ═══
            const Gauge = ({ value, max, label, color1 = '#4338ca', color2 = '#06b6d4', size = 110 }) => {
                const pct = Math.min(Math.abs(value), max) / max;
                const circ = Math.PI * 2 * 42;
                return (
                    <svg viewBox="0 0 120 120" width={size} height={size}>
                        <circle cx="60" cy="60" r="42" fill="none" stroke="#e2e8f0" strokeWidth="12" />
                        <circle cx="60" cy="60" r="42" fill="none" stroke={`url(#g_${label})`} strokeWidth="12"
                            strokeDasharray={`${pct * circ} ${circ}`} strokeLinecap="round" transform="rotate(-90 60 60)" />
                        <defs><linearGradient id={`g_${label}`} x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor={color1}/><stop offset="100%" stopColor={color2}/></linearGradient></defs>

                                                <td className="py-2.5 px-3 text-slate-600">{getHoldingPeriodText(horse)}</td>
                                                <td className="py-2.5 px-3 text-slate-600">{sp?`${fmt(sp)} €`:'—'}</td>
                                                <td className={`py-2.5 px-3 font-bold ${pl!==null?(pl>=0?'text-emerald-600':'text-red-500'):'text-slate-400'}`}>{pl!==null?`${pl>=0?'+':''}${fmt(pl)} €`:'—'}</td>
                                            </tr>
                                        );})}</tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* ═══ FAMILY OFFICE VIEW ═══ */}
                        {activeView === 'familyoffice' && (()=>{
                            const fo = getFOMetrics();
                            return (
                                <div className="space-y-6">
                                    {/* Header */}
                                    <div className="glass rounded-2xl shadow-lg p-6 border border-white/60">
                                        <div className="flex items-center gap-3 mb-2">
                                            <div className="p-2.5 bg-slate-800 rounded-xl text-white"><Briefcase size={24}/></div>
                                            <div>
                                                <h2 className="text-2xl font-extrabold text-slate-800">Family Office Report</h2>
                                                <p className="text-slate-500 text-sm">Vue investisseur · Métriques Private Equity · {formatDateFR(new Date().toISOString().split('T')[0])}</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* ── 1. PERFORMANCE DU PORTEFEUILLE ── */}
                                    <div className="fo-section border-indigo-400">
                                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><TrendingUp size={20} className="text-indigo-500"/>Performance du portefeuille</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-4">
                                            <div className="glass rounded-xl p-5 border border-white/60 text-center">
                                                <Gauge value={fo.tvpi} max={3} label="TVPI" color1="#4338ca" color2="#7c3aed" />
                                                <p className="text-xs text-slate-500 mt-2">Total Value to Paid-In</p>
                                                <p className="text-xs text-slate-400">Réalisé + Non réalisé / Capital investi</p>
                                            </div>
                                            <div className="glass rounded-xl p-5 border border-white/60 text-center">
                                                <Gauge value={fo.dpi} max={3} label="DPI" color1="#059669" color2="#10b981" />
                                                <p className="text-xs text-slate-500 mt-2">Distributed to Paid-In</p>
                                                <p className="text-xs text-slate-400">Cash retourné / Capital investi</p>
                                            </div>
                                            <div className="glass rounded-xl p-5 border border-white/60 text-center">
                                                <Gauge value={fo.rvpi} max={3} label="RVPI" color1="#d97706" color2="#f59e0b" />
                                                <p className="text-xs text-slate-500 mt-2">Residual Value to Paid-In</p>
                                                <p className="text-xs text-slate-400">Valeur estimée restante / Capital investi</p>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-3 gap-3">
                                            <div className="bg-indigo-50 rounded-xl p-4 border border-indigo-100"><p className="text-xs text-slate-500">Capital investi</p><p className="text-xl font-extrabold text-indigo-600 stat-value">{fmt(fo.totalPaidIn)} €</p></div>
                                            <div className="bg-emerald-50 rounded-xl p-4 border border-emerald-100"><p className="text-xs text-slate-500">Distribué (net)</p><p className="text-xl font-extrabold text-emerald-600 stat-value">{fmt(fo.totalDistributed)} €</p></div>
                                            <div className="bg-amber-50 rounded-xl p-4 border border-amber-100"><p className="text-xs text-slate-500">Valeur résiduelle</p><p className="text-xl font-extrabold text-amber-600 stat-value">{fmt(fo.totalResidualValue)} €</p></div>
                                        </div>
                                        {/* Estimated values for active horses */}
                                        {fo.activeCount > 0 && (
                                            <div className="mt-4 bg-amber-50/50 rounded-xl p-4 border border-amber-100">
                                                <p className="text-xs font-semibold text-amber-700 mb-3">Estimation de la valeur des chevaux actifs (pour calcul RVPI & TVPI)</p>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                    {horses.filter(h=>!h.actualSaleDate).map(h=>(
                                                        <div key={h.id} className="flex items-center gap-2 bg-white rounded-lg p-2">
                                                            <span className="text-sm font-medium text-slate-700 flex-1">{h.name}</span>
                                                            <span className="text-xs text-slate-400">({fmt(getTotalExpenses(h))} € inv.)</span>
                                                            <input type="number" placeholder="Val. estimée" value={foEstimatedValues[h.id]||''} onChange={e=>setFoEstimatedValues({...foEstimatedValues,[h.id]:e.target.value})}
                                                                className="w-28 px-2 py-1 text-sm border border-amber-200 rounded-lg bg-amber-50 text-right"/>
                                                            <span className="text-xs text-slate-400">€</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* ── 2. GESTION DU RISQUE ── */}
                                    <div className="fo-section border-red-400">
                                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><Shield size={20} className="text-red-500"/>Gestion du risque</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                                            <div className="metric-card bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
                                                <p className="text-xs text-slate-500">Taux de réussite</p>
                                                <p className="text-2xl font-extrabold stat-value text-emerald-600">{fo.winRate.toFixed(0)}%</p>
                                                <p className="text-xs text-slate-400">{fo.wins}W / {fo.losses}L sur {fo.soldCount} ventes</p>
                                            </div>
                                            <div className="metric-card bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
                                                <p className="text-xs text-slate-500">Gain/Perte ratio</p>
                                                <p className="text-2xl font-extrabold stat-value text-indigo-600">{fo.gainLossRatio === Infinity ? '∞' : fo.gainLossRatio.toFixed(2)}x</p>
                                                <p className="text-xs text-slate-400">Gain moy. / Perte moy.</p>
                                            </div>
                                            <div className="metric-card bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
                                                <p className="text-xs text-slate-500">Meilleur deal</p>
                                                <p className="text-xl font-extrabold stat-value text-emerald-600">{fo.bestDeal >= 0 ? '+' : ''}{fmt(fo.bestDeal)} €</p>
                                            </div>
                                            <div className="metric-card bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
                                                <p className="text-xs text-slate-500">Pire deal</p>
                                                <p className="text-xl font-extrabold stat-value text-red-500">{fo.worstDeal >= 0 ? '+' : ''}{fmt(fo.worstDeal)} €</p>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-3 gap-3">
                                            <div className="bg-slate-50 rounded-xl p-3 border border-slate-100 text-center"><p className="text-xs text-slate-500">Gain moyen</p><p className="font-bold text-emerald-600">{fmt(fo.avgGain)} €</p></div>
                                            <div className="bg-slate-50 rounded-xl p-3 border border-slate-100 text-center"><p className="text-xs text-slate-500">Perte moyenne</p><p className="font-bold text-red-500">-{fmt(fo.avgLoss)} €</p></div>
                                            <div className="bg-slate-50 rounded-xl p-3 border border-slate-100 text-center"><p className="text-xs text-slate-500">P&L médian</p><p className={`font-bold ${fo.medianDeal>=0?'text-emerald-600':'text-red-500'}`}>{fo.medianDeal>=0?'+':''}{fmt(fo.medianDeal)} €</p></div>
                                        </div>
                                    </div>

                                    {/* ── 3. EFFICACITÉ OPÉRATIONNELLE ── */}
                                    <div className="fo-section border-cyan-400">
                                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><Activity size={20} className="text-cyan-500"/>Efficacité opérationnelle</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                                            <div className="metric-card bg-cyan-50 rounded-xl p-4 border border-cyan-100"><p className="text-xs text-slate-500">Coût mensuel moy./cheval</p><p className="text-xl font-extrabold text-cyan-600 stat-value">{fmt(fo.avgMonthlyCost)} €</p></div>
                                            <div className="metric-card bg-violet-50 rounded-xl p-4 border border-violet-100"><p className="text-xs text-slate-500">Marge nette</p><p className="text-xl font-extrabold text-violet-600 stat-value">{fo.netMargin.toFixed(1)}%</p><p className="text-xs text-slate-400">Après commissions & frais</p></div>
                                            <div className="metric-card bg-slate-50 rounded-xl p-4 border border-slate-200"><p className="text-xs text-slate-500">Total commissions payées</p><p className="text-xl font-extrabold text-slate-700 stat-value">{fmt(fo.totalCommissions)} €</p></div>
                                            <div className="metric-card bg-emerald-50 rounded-xl p-4 border border-emerald-100"><p className="text-xs text-slate-500">Temps moy. au break-even</p><p className="text-xl font-extrabold text-emerald-600 stat-value">{fo.avgBreakEvenMonths.toFixed(1)} mois</p><p className="text-xs text-slate-400">Deals profitables</p></div>
                                        </div>
                                    </div>

                                    {/* ── 4. TENDANCE & IRR PAR DEAL ── */}
                                    <div className="fo-section border-purple-400">
                                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><TrendingUp size={20} className="text-purple-500"/>Prévisibilité & tendance</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            {/* IRR by deal */}
                                            <div className="glass rounded-xl p-5 border border-white/60">
                                                <h4 className="text-sm font-bold text-slate-700 mb-3">IRR par deal (chronologique)</h4>
                                                {fo.irrByDeal.length > 0 ? (
                                                    <div className="space-y-2">
                                                        {fo.irrByDeal.map((d, i) => {
                                                            const maxIrr = Math.max(...fo.irrByDeal.map(x => Math.abs(x.irr)), 1);
                                                            const pct = Math.abs(d.irr) / maxIrr * 100;
                                                            return (
                                                                <div key={i}>
                                                                    <div className="flex justify-between text-xs mb-0.5">
                                                                        <span className="font-medium text-slate-600">#{d.index} {d.name}</span>
                                                                        <span className={d.irr >= 0 ? 'text-emerald-600' : 'text-red-500'}>{fmtPct(d.irr)} /an</span>
                                                                    </div>
                                                                    <div className="w-full bg-slate-100 rounded-full h-2.5">
                                                                        <div className={`h-2.5 rounded-full ${d.irr >= 0 ? 'bg-emerald-400' : 'bg-red-400'}`} style={{ width: `${pct}%` }} />
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                ) : <p className="text-slate-400 text-sm">Pas encore de ventes</p>}
                                            </div>

                                            {/* J-Curve */}
                                            <div className="glass rounded-xl p-5 border border-white/60">
                                                <h4 className="text-sm font-bold text-slate-700 mb-3">Courbe en J — Cash-flow cumulé</h4>
                                                {fo.jCurveData.length > 0 ? (
                                                    <div className="bg-white p-3 rounded-lg">
                                                        <svg viewBox="0 0 400 200" className="w-full h-44">
                                                            {/* Zero line */}
                                                            {(()=>{
                                                                const data = fo.jCurveData;
                                                                const vals = data.map(d=>d.cumulative);
                                                                const minV = Math.min(...vals, 0);
                                                                const maxV = Math.max(...vals, 0);
                                                                const range = Math.max(maxV - minV, 1);
                                                                const getY = v => 180 - ((v - minV) / range) * 170;
                                                                const zeroY = getY(0);
                                                                return <>
                                                                    <line x1="0" y1={zeroY} x2="400" y2={zeroY} stroke="#94a3b8" strokeWidth="0.5" strokeDasharray="4"/>
                                                                    <text x="5" y={zeroY - 5} fontSize="8" fill="#94a3b8">0 €</text>
                                                                    <defs>
                                                                        <linearGradient id="jGrad" x1="0" y1="0" x2="0" y2="1">
                                                                            <stop offset="0%" stopColor="#10b981" stopOpacity="0.3"/>
                                                                            <stop offset="50%" stopColor="#e2e8f0" stopOpacity="0.1"/>
                                                                            <stop offset="100%" stopColor="#ef4444" stopOpacity="0.3"/>
                                                                        </linearGradient>
                                                                    </defs>
                                                                    <polygon points={`10,${zeroY} ${data.map((d,i)=>{const x=(i/(Math.max(data.length-1,1)))*380+10;return`${x},${getY(d.cumulative)}`;}).join(' ')} ${(data.length-1)/(Math.max(data.length-1,1))*380+10},${zeroY}`} fill="url(#jGrad)"/>
                                                                    <polyline points={data.map((d,i)=>{const x=(i/(Math.max(data.length-1,1)))*380+10;return`${x},${getY(d.cumulative)}`;}).join(' ')} fill="none" stroke="#4338ca" strokeWidth="2.5" strokeLinecap="round"/>
                                                                    {data.map((d,i)=>{const x=(i/(Math.max(data.length-1,1)))*380+10;const y=getY(d.cumulative);return<circle key={i} cx={x} cy={y} r="2.5" fill={d.cumulative>=0?'#10b981':'#ef4444'}/>})}
                                                                    <text x="395" y={getY(vals[vals.length-1])-8} textAnchor="end" fontSize="9" fontWeight="bold" fill={vals[vals.length-1]>=0?'#10b981':'#ef4444'}>{fmt(vals[vals.length-1])} €</text>
                                                                </>;
                                                            })()}
                                                        </svg>
                                                    </div>
                                                ) : <p className="text-slate-400 text-sm">Pas encore de données</p>}
                                            </div>
                                        </div>
                                    </div>

                                    {/* ── 5. PIPELINE ── */}
                                    <div className="fo-section border-amber-400">
                                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><Target size={20} className="text-amber-500"/>Pipeline des ventes</h3>
                                        {fo.pipeline.length > 0 ? (
                                            <div className="glass rounded-xl border border-white/60 overflow-hidden">
                                                <table className="w-full text-sm">
                                                    <thead><tr className="bg-slate-50 border-b border-slate-200">
                                                        {['Cheval','Vente prévue','Jours restants','Investi','Seuil rentabilité','Val. estimée'].map(h=><th key={h} className="text-left py-2.5 px-4 font-semibold text-slate-500 text-xs">{h}</th>)}
                                                    </tr></thead>
                                                    <tbody>
                                                        {fo.pipeline.map(h => {
                                                            const be = getBreakEvenPrice(h.totalInvested);
                                                            return (
                                                                <tr key={h.id} className="border-b border-slate-50 hover:bg-slate-50/50">
                                                                    <td className="py-2.5 px-4 font-medium text-slate-800">{h.name}</td>
                                                                    <td className="py-2.5 px-4 text-slate-600 text-xs">{formatDateFR(h.expectedSaleDate)}</td>
                                                                    <td className={`py-2.5 px-4 font-medium text-xs ${h.daysLeft < 0 ? 'text-red-500' : h.daysLeft <= 30 ? 'text-amber-500' : 'text-emerald-600'}`}>{h.daysLeft < 0 ? `${Math.abs(h.daysLeft)}j en retard` : `${h.daysLeft}j`}</td>
                                                                    <td className="py-2.5 px-4 text-slate-700">{fmt(h.totalInvested)} €</td>
                                                                    <td className="py-2.5 px-4 text-indigo-600 font-medium">{fmt(be)} €</td>
                                                                    <td className="py-2.5 px-4 text-slate-600">{h.estimatedValue > 0 ? `${fmt(h.estimatedValue)} €` : '—'}</td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        ) : <div className="glass rounded-xl p-8 border border-white/60 text-center"><p className="text-slate-400">Aucune vente prévisionnelle enregistrée</p><p className="text-xs text-slate-400 mt-1">Ajoutez des dates de vente prévisionnelle sur vos chevaux actifs</p></div>}
                                    </div>

                                    {/* ── 6. LIQUIDITÉ ── */}
                                    <div className="fo-section border-emerald-400">
                                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><Zap size={20} className="text-emerald-500"/>Liquidité & Velocity</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                            <div className="metric-card bg-white rounded-xl p-4 border border-slate-200 shadow-sm text-center">
                                                <Gauge value={getCapitalTurnover()} max={3} label="Cap. Turnover" size={90} />
                                            </div>
                                            {(()=>{const v=getVelocityOfDeals();return v ? <>
                                                <div className="metric-card bg-white rounded-xl p-4 border border-slate-200 shadow-sm"><p className="text-xs text-slate-500">Holding moyen</p><p className="text-2xl font-extrabold stat-value text-indigo-600">{v.avgMonths.toFixed(1)} mois</p><p className="text-xs text-slate-400">{v.avgDays.toFixed(0)} jours</p></div>
                                                <div className="metric-card bg-white rounded-xl p-4 border border-slate-200 shadow-sm"><p className="text-xs text-slate-500">Velocity</p><p className="text-2xl font-extrabold stat-value text-amber-600">{v.dealsPerYear.toFixed(1)}</p><p className="text-xs text-slate-400">deals / an (est.)</p></div>
                                                <div className="metric-card bg-white rounded-xl p-4 border border-slate-200 shadow-sm"><p className="text-xs text-slate-500">Deals complétés</p><p className="text-2xl font-extrabold stat-value text-emerald-600">{v.count}</p><p className="text-xs text-slate-400">sur {horses.length} total</p></div>
                                            </> : <div className="col-span-3 bg-slate-50 rounded-xl p-6 border border-slate-100 text-center"><p className="text-slate-400 text-sm">Enregistrez des ventes pour voir les métriques de liquidité</p></div>})()}
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
